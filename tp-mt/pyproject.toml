[project]
name = "tp-mt"
version = "0.1.0"
description = "toki pona <-> English/Chinese MT with atomic glyph tokens and an attention linker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "eflomal>=2.0.0",
    "gensim>=4.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.2",
    "torch>=2.11,<2.12",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "umap-learn>=0.5.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
